<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Védett fajok – Felhasználói oldal</title>
    <th:block th:replace="~{fragments :: head}"></th:block>
</head>
<body class="is-preload">
<div id="wrapper">
    <th:block th:replace="~{fragments :: header}"></th:block>

    <div id="main" class="alt">
        <section id="one">
            <div class="inner">
                <header class="major"><h1>Felhasználói oldal</h1></header>
                <p>Üdv, <strong sec:authentication="name"></strong>! Ezt az oldalt csak bejelentkezett felhasználók látják.</p>
                <ul class="actions">
                    <li><a th:href="@{/}" class="button primary">Tovább a Főoldalra</a></li>
                </ul>
            </div>
        </section>
    </div>

    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
