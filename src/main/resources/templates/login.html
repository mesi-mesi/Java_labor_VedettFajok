<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title>Védett fajok – Bejelentkezés</title>
  <th:block th:replace="~{fragments :: head}"></th:block>
</head>
<body class="is-preload">
<div id="wrapper">
  <th:block th:replace="~{fragments :: header}"></th:block>

  <div id="main" class="alt">
    <section id="one">
      <div class="inner">
        <header class="major"><h1>Bejelentkezés</h1></header>

        <p th:if="${param.registered}" style="color:#9bf1ff;">Sikeres regisztráció! Most már bejelentkezhetsz.</p>
        <p th:if="${param.error}" style="color:#ff7496;">Hibás felhasználónév vagy jelszó!</p>

        <form th:action="@{/login}" method="post">
          <div class="fields">
            <div class="field half">
              <label for="username">Felhasználónév</label>
              <input type="text" name="username" id="username" required />
            </div>
            <div class="field half">
              <label for="password">Jelszó</label>
              <input type="password" name="password" id="password" required />
            </div>
          </div>
          <ul class="actions">
            <li><input type="submit" value="Bejelentkezés" class="primary" /></li>
            <li><a th:href="@{/register}" class="button">Regisztráció</a></li>
          </ul>
        </form>
      </div>
    </section>
  </div>

  <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
