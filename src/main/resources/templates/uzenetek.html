<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Védett fajok – Üzenetek</title>
    <th:block th:replace="~{fragments :: head}"></th:block>
</head>
<body class="is-preload">
<div id="wrapper">
    <th:block th:replace="~{fragments :: header}"></th:block>

    <div id="main" class="alt">
        <section id="one">
            <div class="inner">
                <header class="major"><h1>Üzenetek</h1></header>
                <p>A Kapcsolat űrlapon küldött üzenetek, a legfrissebb elöl.</p>

                <p th:if="${#lists.isEmpty(uzenetek)}">Még nem érkezett üzenet.</p>

                <div class="table-wrapper" th:unless="${#lists.isEmpty(uzenetek)}">
                    <table>
                        <thead>
                        <tr>
                            <th>Küldés ideje</th>
                            <th>Név</th>
                            <th>E-mail</th>
                            <th>Üzenet</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${uzenetek}">
                            <td th:text="${#temporals.format(u.kuldesIdeje, 'yyyy.MM.dd. HH:mm')}"></td>
                            <td th:text="${u.nev}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.szoveg}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>

    <th:block th:replace="~{fragments :: footer}"></th:block>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
